events { worker_connections 1024; }
http {
    access_log off;
    error_log /dev/null crit;
    server_tokens off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    limit_req_zone $binary_remote_addr zone=handshake:1m rate=10r/m;
    server {
        listen 443 ssl;
        ssl_certificate /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location = /ws {
            limit_req zone=handshake burst=10 nodelay;
            proxy_pass http://signaling:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
            proxy_buffering off;
        }
        location = /join { proxy_pass http://signaling:8080; }
        location = /health { proxy_pass http://signaling:8080; }
        location / { return 404; }
    }
}
