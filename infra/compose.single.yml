# Oracle NAT, one public IP. Keep the old IP certificate for 0.1.4 clients.
services:
  signaling:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      TURN_SECRET: ${TURN_SECRET:?set private TURN_SECRET}
      TURN_HOST: ${SIGNAL_HOST:?set SIGNAL_HOST}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: {driver: none}
  proxy:
    image: nginx:1.28-alpine
    ports: ['${SIGNAL_IP:-0.0.0.0}:80:80', '${SIGNAL_IP:-0.0.0.0}:443:443']
    environment:
      SIGNAL_HOST: ${SIGNAL_HOST:?set SIGNAL_HOST}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: SIGNAL_HOST
    volumes:
      - ./nginx.single.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./certs/signal:/certs/legacy:ro
      - ./certs/public:/certs/public:ro
      - ./acme-webroot:/acme:ro
    depends_on:
      signaling: {condition: service_healthy}
    restart: unless-stopped
    logging: {driver: none}
  turn:
    user: "0:0"
    image: coturn/coturn:4.18.0-r0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    network_mode: host
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        exec turnserver -n --no-multicast-peers
        --denied-peer-ip=10.0.0.0-10.255.255.255
        --denied-peer-ip=172.16.0.0-172.31.255.255
        --denied-peer-ip=192.168.0.0-192.168.255.255
        --denied-peer-ip=169.254.0.0-169.254.255.255
        --denied-peer-ip=::1 --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
        --listening-ip="$${TURN_PRIVATE_IP}" --relay-ip="$${TURN_PRIVATE_IP}"
        --external-ip="$${TURN_PUBLIC_IP}/$${TURN_PRIVATE_IP}" --realm="$${SIGNAL_HOST}"
        --listening-port=3478 --tls-listening-port=5349
        --min-port=49160 --max-port=49200
        --use-auth-secret --static-auth-secret="$${TURN_SECRET}"
        --cert=/certs/fullchain.pem --pkey=/certs/privkey.pem
        --user-quota=8 --total-quota=64 --max-bps=20000000 --bps-capacity=40000000
        --log-file=/dev/null --no-stdout-log --simple-log
    environment:
      TURN_SECRET: ${TURN_SECRET:?set private TURN_SECRET}
      TURN_PRIVATE_IP: ${TURN_PRIVATE_IP:?set TURN_PRIVATE_IP}
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:?set TURN_PUBLIC_IP}
      SIGNAL_HOST: ${SIGNAL_HOST:?set SIGNAL_HOST}
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/$$TURN_PRIVATE_IP/5349' >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    volumes: ['./certs/public:/certs:ro']
    restart: unless-stopped
    logging: {driver: none}
