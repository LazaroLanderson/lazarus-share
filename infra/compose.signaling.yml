# Single public IP: rooms/P2P only, no TURN credentials or relay.
services:
  signaling:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      TURN_SECRET: ""
      TURN_HOST: ""
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: none
  proxy:
    image: nginx:1.28-alpine
    ports:
      - "${SIGNAL_IP:-0.0.0.0}:443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/signal:/certs:ro
    depends_on:
      signaling:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: none
