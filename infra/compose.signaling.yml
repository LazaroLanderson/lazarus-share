# Single public IP: rooms/P2P only, no TURN credentials or relay.
services:
  stun:
    image: coturn/coturn:4.6.3
    ports:
      - "${SIGNAL_IP:-0.0.0.0}:3478:3478/udp"
    command:
      - --stun-only
      - --listening-ip=0.0.0.0
      - --listening-port=3478
      - --no-tcp
      - --no-tls
      - --no-dtls
      - --no-cli
      - --no-software-attribute
      - --no-rfc5780
      - --no-stun-backward-compatibility
      - --response-origin-only-with-rfc5780
      - --log-file=/dev/null
      - --no-stdout-log
      - --simple-log
    restart: unless-stopped
    logging:
      driver: none
  signaling:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      TURN_SECRET: ""
      TURN_HOST: ""
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: none
  proxy:
    image: nginx:1.28-alpine
    ports:
      - "${SIGNAL_IP:-0.0.0.0}:443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/signal:/certs:ro
    depends_on:
      signaling:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: none
