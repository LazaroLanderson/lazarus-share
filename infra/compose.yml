services:
  signaling:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET}
      TURN_HOST: ${TURN_HOST:?set TURN_HOST}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: none
  proxy:
    image: nginx:1.28-alpine
    ports:
      - "${SIGNAL_IP:?set SIGNAL_IP}:443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/signal:/certs:ro
    depends_on:
      signaling:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: none
  turn:
    image: coturn/coturn:4.18.0-r0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    network_mode: host
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        exec turnserver -n --no-multicast-peers
        --denied-peer-ip=10.0.0.0-10.255.255.255
        --denied-peer-ip=172.16.0.0-172.31.255.255
        --denied-peer-ip=192.168.0.0-192.168.255.255
        --denied-peer-ip=169.254.0.0-169.254.255.255
        --listening-ip="$${TURN_IP}" --relay-ip="$${TURN_IP}"
        --external-ip="$${TURN_IP}" --realm="$${TURN_HOST}"
        --listening-port=3478 --tls-listening-port=443
        --min-port=49160 --max-port=49200
        --use-auth-secret --static-auth-secret="$${TURN_SECRET}"
        --cert=/certs/fullchain.pem --pkey=/certs/privkey.pem
        --user-quota=8 --total-quota=64 --max-bps=5000000
        --log-file=/dev/null --no-stdout-log --simple-log
    environment:
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET}
      TURN_IP: ${TURN_IP:?set TURN_IP}
      TURN_HOST: ${TURN_HOST:?set TURN_HOST}
    volumes:
      - ./certs/turn:/certs:ro
    restart: unless-stopped
    logging:
      driver: none
