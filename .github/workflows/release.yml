name: Publish tested release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build and verify run ID on main
        required: true
      version:
        description: Release version without v (for example 0.1.3)
        required: true
      publish:
        description: Publish after successful external VPS verification (otherwise draft)
        type: boolean
        default: false
      verification_run_id:
        description: Successful Verify public VPS relay run for the same commit (required to publish)
        required: false
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate source build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
          VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/source-run.json"
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          run=json.loads(Path(os.environ['RUNNER_TEMP']+'/source-run.json').read_text())
          assert run['conclusion']=='success' and run['event']=='push' and run['head_branch']=='main'
          assert run['path']=='.github/workflows/build.yml'
          sha=run['head_sha']
          raw=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/CMakeLists.txt?ref='+sha],text=True))
          assert 'VERSION '+os.environ['VERSION']+' ' in base64.b64decode(raw['content']).decode()
          if os.environ.get('PUBLISH')=='true':
              verification_id=os.environ.get('VERIFICATION_RUN_ID','')
              assert verification_id.isdecimal(), 'External verification run is required'
              verified=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+verification_id],text=True))
              assert verified['conclusion']=='success' and verified['head_sha']==sha and verified['path']=='.github/workflows/verify-vps.yml', 'Public VPS verification must match this build'
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('sha='+sha+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: LazarusShare-*
          path: release
          merge-multiple: true
      - name: Publish binaries and verified checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RUN_ID: ${{ inputs.run_id }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -Eeuo pipefail
          cd release
          test -s LazarusShare.exe
          test -s LazarusShare-x86_64.AppImage
          sha256sum LazarusShare.exe LazarusShare-x86_64.AppImage > SHA256SUMS
          if [[ -f "$GITHUB_WORKSPACE/docs/releases/$VERSION.md" ]]; then
            cp "$GITHUB_WORKSPACE/docs/releases/$VERSION.md" notes.md
          else
            printf 'Versão experimental %s. AppImage Linux e EXE Windows portáteis.\n' "$VERSION" > notes.md
          fi
          cat >> notes.md <<EOF

          [Build e validação dos dois pacotes](https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID).
          Fonte: $SOURCE_SHA. Captura real entre PCs, outras GPUs e aceitação na Dtel continuam dependendo de testes em equipamentos reais.
          EOF
          gh api "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/existing-releases.json"
          state=$(python3 - <<'PYEXIST'
          import os,json
          from pathlib import Path
          releases=json.loads(Path(os.environ['RUNNER_TEMP']+'/existing-releases.json').read_text())
          release=next((r for r in releases if r['tag_name']=='v'+os.environ['VERSION']),None)
          print('missing' if release is None else 'draft' if release['draft'] else 'published')
          PYEXIST
          )
          if [[ "$state" == missing ]]; then
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "Lazarus Share $VERSION — experimental" --prerelease --draft --notes-file notes.md
          elif [[ "$state" != draft ]]; then
            echo 'Refusing to overwrite a published release'; exit 1
          fi
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber LazarusShare.exe LazarusShare-x86_64.AppImage SHA256SUMS
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          gh api "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          releases=json.loads(Path(os.environ['RUNNER_TEMP']+'/releases.json').read_text())
          release=next(r for r in releases if r['tag_name']=='v'+os.environ['VERSION'])
          for name in ('LazarusShare.exe','LazarusShare-x86_64.AppImage','SHA256SUMS'):
              asset=next(a for a in release['assets'] if a['name']==name)
              assert asset['digest']=='sha256:'+hashlib.sha256(Path(name).read_bytes()).hexdigest(), name
          PY
          if [[ "$PUBLISH" == true ]]; then
            gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            echo "Verified assets prepared in draft; public infrastructure validation is pending"
          fi
