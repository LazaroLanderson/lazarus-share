name: Inspect VPS
on:
  workflow_dispatch:
    inputs:
      prepare_checkout:
        description: Prepare missing VPS project directory (no container or TLS changes)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check VPS prerequisites through verified SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          PREPARE_CHECKOUT: ${{ inputs.prepare_checkout }}
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY || secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          VPS_PORT=${VPS_PORT:-22}
          VPS_DEPLOY_PATH=${VPS_DEPLOY_PATH:-/opt/lazarus-share}
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          [[ "$VPS_DEPLOY_PATH" =~ ^/[A-Za-z0-9/_.-]+$ ]]
          PREPARE_CHECKOUT=${PREPARE_CHECKOUT:-false}
          [[ "$PREPARE_CHECKOUT" == true || "$PREPARE_CHECKOUT" == false ]]
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          umask 077
          mkdir -p "$RUNNER_TEMP/lazarus-ssh"
          key="$RUNNER_TEMP/lazarus-ssh/key"
          hosts="$RUNNER_TEMP/lazarus-ssh/known_hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          python3 infra/prepare_ssh.py "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts"
          ssh -i "$key" -p "$VPS_PORT" -o ConnectTimeout=15 \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$hosts" "$VPS_USER@$VPS_HOST" \
            "bash -s -- $VPS_DEPLOY_PATH $PREPARE_CHECKOUT" <<'REMOTE'
          set -Eeuo pipefail
          checkout=$1
          prepare=$2
          if [[ "$prepare" == true ]]; then
            if [[ ! -d "$checkout/.git" ]]; then
              if [[ ! -d "$checkout" ]]; then
                if [[ -w $(dirname "$checkout") ]]; then
                  mkdir -p "$checkout"
                else
                  sudo -n install -d -m 750 -o "$(id -u)" -g "$(id -g)" "$checkout"
                fi
              fi
              git clone https://github.com/LazaroLanderson/lazarus-share.git "$checkout"
            else
              [[ $(git -C "$checkout" remote get-url origin) == https://github.com/LazaroLanderson/lazarus-share.git ]] || { echo 'Checkout origin does not match Lazarus Share'; exit 1; }
            fi
            mkdir -p "$checkout/infra/certs/signal"
            chmod 700 "$checkout/infra/certs"
            echo 'Project checkout prepared; containers and certificates unchanged'
          fi
          . /etc/os-release
          printf 'System: %s\n' "$PRETTY_NAME"
          printf 'Architecture: %s\n' "$(uname -m)"
          if command -v docker >/dev/null; then
            docker compose version || true
            if docker info >/dev/null 2>&1; then echo 'Docker engine access: yes'; else echo 'Docker engine access: no'; fi
          else echo 'Docker installed: no'; fi
          if command -v git >/dev/null; then echo 'Git installed: yes'; else echo 'Git installed: no'; fi
          if [[ -d "$checkout/.git" ]]; then echo 'Project checkout: present'; else echo 'Project checkout: missing'; fi
          if [[ -f "$checkout/infra/.env" ]]; then echo 'Environment file: present'; else echo 'Environment file: missing'; fi
          if [[ -r "$checkout/infra/certs/signal/fullchain.pem" && -r "$checkout/infra/certs/signal/privkey.pem" ]]; then echo 'TLS files: readable'; else echo 'TLS files: missing or unreadable'; fi
          if command -v ss >/dev/null; then
            if [[ -n $(ss -H -ltn 'sport = :443') ]]; then echo 'TCP 443: occupied'; else echo 'TCP 443: available'; fi
          else echo 'TCP 443: unknown (ss unavailable)'; fi
          REMOTE
