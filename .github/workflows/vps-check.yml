name: Inspect VPS
on:
  workflow_dispatch:
    inputs:
      prepare_checkout:
        description: Prepare missing VPS project directory (no container or TLS changes)
        type: boolean
        default: false
      prepare_ip_tls:
        description: Prepare a temporary self-signed IP certificate on VPS
        type: boolean
        default: false
      check_public_https:
        description: Test public HTTPS from the GitHub runner after SSH inspection
        type: boolean
        default: false
      open_host_https:
        description: Allow only TCP 443 in the VPS host firewall and persist that rule
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check VPS prerequisites through verified SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          PREPARE_CHECKOUT: ${{ inputs.prepare_checkout }}
          PREPARE_IP_TLS: ${{ inputs.prepare_ip_tls }}
          SIGNAL_HOST: ${{ vars.SIGNAL_HOST }}
          CHECK_PUBLIC_HTTPS: ${{ inputs.check_public_https }}
          OPEN_HOST_HTTPS: ${{ inputs.open_host_https }}
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY || secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          VPS_PORT=${VPS_PORT:-22}
          VPS_DEPLOY_PATH=${VPS_DEPLOY_PATH:-/opt/lazarus-share}
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          [[ "$VPS_DEPLOY_PATH" =~ ^/[A-Za-z0-9/_.-]+$ ]]
          PREPARE_CHECKOUT=${PREPARE_CHECKOUT:-false}
          [[ "$PREPARE_CHECKOUT" == true || "$PREPARE_CHECKOUT" == false ]]
          PREPARE_IP_TLS=${PREPARE_IP_TLS:-false}
          [[ "$PREPARE_IP_TLS" == true || "$PREPARE_IP_TLS" == false ]]
          SIGNAL_HOST=${SIGNAL_HOST:--}
          if [[ "$PREPARE_IP_TLS" == true ]]; then [[ "$SIGNAL_HOST" =~ ^[0-9.]+$ ]]; fi
          [[ "$SIGNAL_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          OPEN_HOST_HTTPS=${OPEN_HOST_HTTPS:-false}
          [[ "$OPEN_HOST_HTTPS" == true || "$OPEN_HOST_HTTPS" == false ]]
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          umask 077
          mkdir -p "$RUNNER_TEMP/lazarus-ssh"
          key="$RUNNER_TEMP/lazarus-ssh/key"
          hosts="$RUNNER_TEMP/lazarus-ssh/known_hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          python3 infra/prepare_ssh.py "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts"
          status="$RUNNER_TEMP/lazarus-vps-status"
          ssh -i "$key" -p "$VPS_PORT" -o ConnectTimeout=15 \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$hosts" "$VPS_USER@$VPS_HOST" \
            "bash -s -- $VPS_DEPLOY_PATH $PREPARE_CHECKOUT $PREPARE_IP_TLS $SIGNAL_HOST $GITHUB_SHA $OPEN_HOST_HTTPS" <<'REMOTE' | tee "$status"
          set -Eeuo pipefail
          checkout=$1
          prepare=$2
          prepare_tls=$3
          signal_host=$4
          revision=$5
          open_https=$6
          if [[ "$open_https" == true ]]; then
            [[ -n $(ss -H -ltn 'sport = :443') ]] || { echo 'Refusing firewall change: HTTPS is not listening'; exit 1; }
            sudo -n tee /etc/systemd/system/lazarus-share-https-firewall.service >/dev/null <<'UNIT'
          [Unit]
          Description=Allow Lazarus Share HTTPS without changing other firewall rules
          After=network-pre.target netfilter-persistent.service ufw.service
          Before=docker.service
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/sh -c '/usr/sbin/iptables -w 5 -C INPUT -p tcp --dport 443 -m comment --comment lazarus-share-https -j ACCEPT || /usr/sbin/iptables -w 5 -I INPUT 1 -p tcp --dport 443 -m comment --comment lazarus-share-https -j ACCEPT'
          [Install]
          WantedBy=multi-user.target
          UNIT
            sudo -n systemctl daemon-reload
            sudo -n systemctl enable --now lazarus-share-https-firewall.service
            sudo -n iptables -w 5 -C INPUT -p tcp --dport 443 -m comment --comment lazarus-share-https -j ACCEPT
            echo 'Dedicated TCP 443 host firewall rule enabled; other rules unchanged'
          fi
          if [[ "$prepare" == true ]]; then
            if [[ ! -d "$checkout/.git" ]]; then
              if [[ ! -d "$checkout" ]]; then
                if [[ -w $(dirname "$checkout") ]]; then
                  mkdir -p "$checkout"
                else
                  sudo -n install -d -m 750 -o "$(id -u)" -g "$(id -g)" "$checkout"
                fi
              fi
              git clone https://github.com/LazaroLanderson/lazarus-share.git "$checkout"
            else
              [[ $(git -C "$checkout" remote get-url origin) == https://github.com/LazaroLanderson/lazarus-share.git ]] || { echo 'Checkout origin does not match Lazarus Share'; exit 1; }
            fi
            mkdir -p "$checkout/infra/certs/signal"
            chmod 700 "$checkout/infra/certs"
            echo 'Project checkout prepared; containers and certificates unchanged'
          fi
          if [[ "$prepare_tls" == true ]]; then
            cd "$checkout"
            [[ -z $(git status --porcelain --untracked-files=no) ]] || { echo 'Tracked checkout has local changes'; exit 1; }
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$revision" origin/main
            git checkout --detach "$revision"
            bash infra/bootstrap-ip.sh "$signal_host"
          fi
          . /etc/os-release
          printf 'System: %s\n' "$PRETTY_NAME"
          printf 'Architecture: %s\n' "$(uname -m)"
          if command -v docker >/dev/null; then
            docker compose version || true
            if docker info >/dev/null 2>&1; then echo 'Docker engine access: yes'; else echo 'Docker engine access: no'; fi
          else echo 'Docker installed: no'; fi
          if command -v git >/dev/null; then echo 'Git installed: yes'; else echo 'Git installed: no'; fi
          if [[ -d "$checkout/.git" ]]; then echo 'Project checkout: present'; else echo 'Project checkout: missing'; fi
          if [[ -f "$checkout/infra/.env" ]]; then echo 'Environment file: present'; else echo 'Environment file: missing'; fi
          if [[ -r "$checkout/infra/certs/signal/fullchain.pem" && -r "$checkout/infra/certs/signal/privkey.pem" ]]; then echo 'TLS files: readable'; else echo 'TLS files: missing or unreadable'; fi
          if command -v ss >/dev/null; then
            if [[ -n $(ss -H -ltn 'sport = :443') ]]; then echo 'TCP 443: occupied'; else echo 'TCP 443: available'; fi
          else echo 'TCP 443: unknown (ss unavailable)'; fi
          if [[ -r "$checkout/infra/certs/signal/fullchain.pem" ]]; then
            openssl x509 -in "$checkout/infra/certs/signal/fullchain.pem" -noout -fingerprint -sha256
          fi
          if command -v ufw >/dev/null; then sudo -n ufw status 2>/dev/null | head -n 1 || true; fi
          for chain in DOCKER-USER FORWARD; do
            rules=$(sudo -n iptables -S "$chain" 2>/dev/null || true)
            count=$(printf '%s\n' "$rules" | grep -cE -- '-j (DROP|REJECT)' || true)
            printf 'Restrictive %s rule count: %s\n' "$chain" "$count"
          done
          sudo -n iptables -S FORWARD 2>/dev/null | python3 -c 'import sys,shlex; [print("FORWARD order: "+" ".join(shlex.split(line))) for line in sys.stdin if "-j " in line and not any(c in line for c in (".", "/"))]' || true
          echo 'Host firewall and Docker HTTPS forwarding:'
          sudo -n iptables -S INPUT 2>/dev/null || true
          sudo -n iptables -S DOCKER 2>/dev/null | grep -E -- '(^-N |--dport 443)' || true
          sudo -n iptables -t nat -S DOCKER 2>/dev/null | grep -E -- '(^-N |--dport 443)' || true
          for chain in DOCKER-USER DOCKER-FORWARD DOCKER-BRIDGE DOCKER-CT; do
            sudo -n iptables -S "$chain" 2>/dev/null || true
          done
          ip rule show
          ip route show
          sudo -n nft list tables 2>/dev/null || true
          if command -v tcpdump >/dev/null; then echo 'Packet counter available: yes'; else echo 'Packet counter available: no'; fi
          if [[ -r /sys/class/dmi/id/sys_vendor ]]; then printf 'Machine vendor: '; cat /sys/class/dmi/id/sys_vendor; fi
          if command -v oci >/dev/null; then echo 'Oracle CLI installed: yes'; else echo 'Oracle CLI installed: no'; fi
          docker image inspect ghcr.io/oracle/oci-cli --format 'Oracle container runtime downloaded: yes' 2>/dev/null || echo 'Oracle container runtime downloaded: no'
          docker ps --filter ancestor=ghcr.io/oracle/oci-cli --format 'Oracle API check runtime: {{.Status}}' || true
          if [[ -f ~/.oci/config ]]; then echo 'Oracle API configuration present: yes'; else echo 'Oracle API configuration present: no'; fi
          python3 - <<'PROVIDER'
          import json,urllib.request
          request=urllib.request.Request('http://169.254.169.254/opc/v2/instance/',headers={'Authorization':'Bearer Oracle'})
          try:
              opener=urllib.request.build_opener(urllib.request.ProxyHandler({}))
              with opener.open(request,timeout=2) as response: instance=json.load(response)
              if str(instance.get('id','')).startswith('ocid1.instance.'):
                  print('Cloud provider confirmed by instance metadata: Oracle Cloud')
              else: print('Cloud provider metadata: unrecognized')
          except Exception: print('Cloud provider metadata: unavailable')
          PROVIDER
          REMOTE
          if [[ "${CHECK_PUBLIC_HTTPS:-false}" == true ]]; then
            packet_count="$RUNNER_TEMP/lazarus-https-syn-count"
            ssh -i "$key" -p "$VPS_PORT" -o ConnectTimeout=15 \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$hosts" "$VPS_USER@$VPS_HOST" \
              "bash -s" > "$packet_count" <<'OBSERVER' &
          sudo -n timeout 18 tcpdump -nn -l -i any 'tcp port 443' | python3 -u -c 'import sys,re,collections; counts=collections.Counter(); [(counts.update([m.groups()]) if (m:=re.search(r"(\S+) (In|Out) IP .*?Flags \[([^]]*)\]",line)) else None) for line in sys.stdin]; [print("Interface=%s direction=%s flags=%s count=%s"%(*key,count)) for key,count in sorted(counts.items())]'
          result=${PIPESTATUS[0]}
          [[ "$result" == 0 || "$result" == 124 ]]
          OBSERVER
            observer=$!
            sleep 3
            public_result=0
            python3 - "$status" <<'PYHTTPS' || public_result=$?
          import hashlib,json,os,re,socket,ssl,sys,urllib.request
          from pathlib import Path
          host=os.environ['SIGNAL_HOST']
          matches=re.findall(r'sha256 Fingerprint=([0-9A-F:]{95})',Path(sys.argv[1]).read_text(),re.I)
          if not matches: raise SystemExit('No certificate fingerprint obtained over verified SSH')
          expected=matches[-1].replace(':','').lower()
          with socket.create_connection((host,443),timeout=8) as plain:
              with ssl._create_unverified_context().wrap_socket(plain,server_hostname=host) as channel:
                  certificate=channel.getpeercert(binary_form=True)
                  if hashlib.sha256(certificate).hexdigest()!=expected: raise SystemExit('Public certificate does not match VPS certificate')
          context=ssl.create_default_context(cadata=ssl.DER_cert_to_PEM_cert(certificate))
          with urllib.request.urlopen('https://'+host+'/health',context=context,timeout=8) as response:
              assert json.load(response)=={'ok':True}
          print('Public HTTPS passed from GitHub runner with verified certificate')
          PYHTTPS
            if wait "$observer"; then
              echo 'HTTPS packet observations during public probe (addresses excluded):'
              cat "$packet_count"
            else
              echo 'Packet observer failed; no conclusion about inbound packet arrival'
            fi
            exit "$public_result"
          fi
