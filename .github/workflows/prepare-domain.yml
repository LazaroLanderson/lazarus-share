name: Prepare domain and TURN
on:
  workflow_dispatch:
    inputs:
      hostname:
        description: DNS-only hostname already pointing to this VPS
        required: true
        default: share.app.lazaruslabs.com.br
      public_ip:
        description: VPS public IPv4, verified against Oracle metadata
        required: true
        default: 129.148.20.150
permissions:
  contents: read
concurrency:
  group: vps-production
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify DNS, prepare certificate and bounded TURN access
        env:
          HOSTNAME_INPUT: ${{ inputs.hostname }}
          PUBLIC_IP: ${{ inputs.public_ip }}
          VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY || secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ "$HOSTNAME_INPUT" =~ ^[A-Za-z0-9.-]+$ && "$PUBLIC_IP" =~ ^[0-9.]+$ ]]
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ && "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          VPS_PORT=${VPS_PORT:-22}
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          python3 - <<'PY'
          import os,socket
          values={v[4][0] for v in socket.getaddrinfo(os.environ['HOSTNAME_INPUT'],80,type=socket.SOCK_STREAM)}
          if os.environ['PUBLIC_IP'] not in values: raise SystemExit('DNS is not configured; existing deployment preserved')
          PY
          umask 077
          key="$RUNNER_TEMP/lazarus-key"
          hosts="$RUNNER_TEMP/lazarus-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          python3 infra/prepare_ssh.py "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts"
          connection=(ssh -i "$key" -p "$VPS_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" "$VPS_USER@$VPS_HOST")
          "${connection[@]}" 'if sudo -n ss -H -ltn "sport = :80" | grep -q .; then echo "Port 80 occupied; no changes made" >&2; exit 1; fi'
          "${connection[@]}" "docker run --rm --network host -i --entrypoint python3 ghcr.io/oracle/oci-cli@sha256:fb73376f3ab324ea17e4b04b2dd00da9b559203f766169ccae034ea07c140fb3 - --public-ip $PUBLIC_IP --apply --relay" < infra/oracle_https.py
          "${connection[@]}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          sudo -n tee /etc/systemd/system/lazarus-share-https-firewall.service >/dev/null <<'UNIT'
          [Unit]
          Description=Lazarus Share HTTPS and TURN bounded access
          After=network-online.target
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/sh -ec 'for port in 80 443 3478 5349; do iptables -C INPUT -p tcp --dport "$$port" -m comment --comment lazarus-share -j ACCEPT 2>/dev/null || iptables -I INPUT 1 -p tcp --dport "$$port" -m comment --comment lazarus-share -j ACCEPT; done; for port in 3478 49160:49200; do iptables -C INPUT -p udp --dport "$$port" -m comment --comment lazarus-share -j ACCEPT 2>/dev/null || iptables -I INPUT 1 -p udp --dport "$$port" -m comment --comment lazarus-share -j ACCEPT; done'
          [Install]
          WantedBy=multi-user.target
          UNIT
          sudo -n systemctl daemon-reload
          sudo -n systemctl restart lazarus-share-https-firewall.service
          sudo -n systemctl enable lazarus-share-https-firewall.service
          REMOTE
          "${connection[@]}" "bash -s -- $HOSTNAME_INPUT $PUBLIC_IP" < infra/prepare-domain.sh
